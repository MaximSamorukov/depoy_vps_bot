name: Deploy to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/project/depoy_vps_bot
            cat > .env << 'EOF'
            BOT_TOKEN=${{ secrets.VPS_BOT_TOKEN }}
            DATABASE_URL=postgresql://app:${{ secrets.VPS_DB_PASSWORD }}@postgres:5432/appdb
            NODE_ENV=production
            VITE_API_URL=http://backend:5000/api
            EOF
            cd ~/project/depoy_vps_bot
            GIT_SSH_COMMAND="ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=no" git pull origin dev
            docker compose down
            docker compose --profile production up --build -d
            docker image prune -f
